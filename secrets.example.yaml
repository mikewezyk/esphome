# Copy to secrets.yaml and fill in real values. secrets.yaml is gitignored.
#
# Generate each api_key with:   openssl rand -base64 32
# Generate each *_password with: openssl rand -hex 16
# Use a different value for every key and every device.

wifi_ssid: "YourNetworkName"
wifi_password: "YourWifiPassword"

# Home Assistant API encryption keys (32 bytes, base64)
muas_api_key: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="  # dummy - replace
erv_api_key: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="  # dummy - replace
sprinkler_api_key: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="  # dummy - replace

# Over-the-air update passwords
muas_ota_password: "REPLACE_ME"
erv_ota_password: "REPLACE_ME"
sprinkler_ota_password: "REPLACE_ME"

# Fallback hotspot passwords (8+ characters, used only if Wi-Fi fails)
muas_ap_password: "REPLACE_ME_8_CHARS_MIN"
erv_ap_password: "REPLACE_ME_8_CHARS_MIN"
sprinkler_ap_password: "REPLACE_ME_8_CHARS_MIN"
