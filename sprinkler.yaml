# Lawn irrigation controller: 3 zones sharing one pump, using ESPHome's built-in
# `sprinkler` controller. See README.md for wiring.

substitutions:
  name: sprinkler
  friendly_name: Sprinkler   # Only used for the fallback hotspot name

  # --- Pins (NodeMCU-32S). All relay outputs are active low. ---
  pump_pin: GPIO32
  zone1_pin: GPIO33   # Backyard Corner
  zone2_pin: GPIO25   # Backyard Center
  zone3_pin: GPIO26   # Backyard Drip

esphome:
  name: ${name}

esp32:
  board: nodemcu-32s
  framework:
    type: arduino

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret sprinkler_api_key

ota:
  - platform: esphome
    password: !secret sprinkler_ota_password

wifi:
  power_save_mode: none
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret sprinkler_ap_password

captive_portal:

sprinkler:
  - id: lawn_sprinkler_ctrlr
    main_switch: "Lawn Sprinklers"
    auto_advance_switch: "Lawn Sprinklers Auto Advance"
    reverse_switch: "Lawn Sprinklers Reverse"
    valve_open_delay: 5s
    valves:
      - valve_switch: "Backyard Corner Zone"
        enable_switch: "Enable Backyard Corner Zone"
        pump_switch_id: sprinkler_pump_sw
        run_duration_number:
          name: "Backyard Corner Zone Duration"
          initial_value: 900
          min_value: 1
          max_value: 1800
          step: 1
          unit_of_measurement: s
          restore_value: true
        valve_switch_id: lawn_sprinkler_valve_sw0
      - valve_switch: "Backyard Center Zone"
        enable_switch: "Enable Backyard Center Zone"
        pump_switch_id: sprinkler_pump_sw
        run_duration_number:
          name: "Backyard Center Zone Duration"
          initial_value: 900
          min_value: 1
          max_value: 1800
          step: 1
          unit_of_measurement: s
          restore_value: true
        valve_switch_id: lawn_sprinkler_valve_sw1
      - valve_switch: "Backyard Drip Zone"
        enable_switch: "Enable Backyard Drip Zone"
        pump_switch_id: sprinkler_pump_sw
        run_duration_number:
          name: "Backyard Drip Zone Duration"
          initial_value: 900
          min_value: 1
          max_value: 3600
          step: 1
          unit_of_measurement: s
          restore_value: true
        valve_switch_id: lawn_sprinkler_valve_sw2

switch:
  # Fail safe: every relay is forced off after a reboot or power loss, so a
  # crash can never leave the pump or a valve running.
  - platform: gpio
    id: sprinkler_pump_sw
    restore_mode: ALWAYS_OFF
    pin:
      number: ${pump_pin}
      inverted: true
  - platform: gpio
    id: lawn_sprinkler_valve_sw0
    restore_mode: ALWAYS_OFF
    pin:
      number: ${zone1_pin}
      inverted: true
  - platform: gpio
    id: lawn_sprinkler_valve_sw1
    restore_mode: ALWAYS_OFF
    pin:
      number: ${zone2_pin}
      inverted: true
  - platform: gpio
    id: lawn_sprinkler_valve_sw2
    restore_mode: ALWAYS_OFF
    pin:
      number: ${zone3_pin}
      inverted: true
