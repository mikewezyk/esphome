#
# Makeup Air System (MUAS)
# Watches the 0-10V speed signal of an ECM range-hood fan and drives a
# proportional 0-10V makeup-air fan plus a 24V damper relay.
# See README.md for wiring and calibration.

substitutions:
  name: muas
  friendly_name: Makeup Air   # Only used for the fallback hotspot name

  # --- Tuning ---
  max_voltage: "10"                 # Exhaust fan signal voltage at 100% speed
  exhaust_fan_threshold_low: "2"    # Below this voltage (V) the system is idle
  makeup_air_fan_max_speed: "30"    # Makeup fan speed (%) when exhaust is at max_voltage.
                                    # Calibrate with a manometer so indoor/outdoor
                                    # differential pressure is ~0 Pa.
  damper_open_delay: 10s            # Let the damper open before the fan starts
  # Voltage divider on the ADC input: (R_top + R_bottom) / R_bottom scaled for
  # the ESP32 3.3V range. 3.1757 = (49254 / 47000) * (10 / 3.3). Recompute if
  # you change the resistors.
  adc_multiplier: "3.1757"

  # --- Pins (NodeMCU-32S) ---
  adc_pin: GPIO36        # Exhaust fan 0-10V signal, through a voltage divider
  fan_pwm_pin: GPIO25    # PWM to 0-10V converter for the makeup air ECM fan
  damper_pin: GPIO26     # Relay for the 24V damper (active low)

esphome:
  name: ${name}

esp32:
  board: nodemcu-32s
  framework:
    type: arduino

logger:

api:
  encryption:
    key: !secret muas_api_key

ota:
  - platform: esphome
    password: !secret muas_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2
  # Fallback hotspot (captive portal) if the Wi-Fi connection fails
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret muas_ap_password

captive_portal:

switch:
  - platform: gpio
    pin:
      number: ${damper_pin}
      inverted: true
    name: Makeup Air Damper
    id: makeup_air_damper
    # Fail safe: damper stays closed after a reboot until the script opens it.
    restore_mode: ALWAYS_OFF

sensor:
  - platform: adc
    pin: ${adc_pin}
    id: exhaust_hood_voltage
    name: "Exhaust Hood Voltage"
    update_interval: 5s
    attenuation: auto
    filters:
      - multiply: ${adc_multiplier}
    on_value:
      then:
        - script.execute: set_fan_state

output:
  - platform: ledc
    pin: ${fan_pwm_pin}
    id: makeup_air_fan_pwm_output
    frequency: 3000Hz

fan:
  - platform: speed
    output: makeup_air_fan_pwm_output
    id: makeup_air_fan
    name: Makeup Air Fan
    restore_mode: ALWAYS_OFF

script:
  - id: set_fan_state
    # restart: if the hood is switched off during the damper delay, the pending
    # "start fan" is cancelled instead of the new "turn off" being ignored.
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              // Treat a failed ADC read (NaN) as "hood off" so we fail safe.
              float v = id(exhaust_hood_voltage).state;
              return isnan(v) || v < ${exhaust_fan_threshold_low};
          then:
            - fan.turn_off: makeup_air_fan
            - switch.turn_off: makeup_air_damper
          else:
            - switch.turn_on: makeup_air_damper
            - delay: ${damper_open_delay}
            - fan.turn_on:
                id: makeup_air_fan
                speed: !lambda |-
                  // Linear map: exhaust voltage -> 0..max_speed percent.
                  float ratio = id(exhaust_hood_voltage).state / ${max_voltage};
                  if (ratio > 1.0f) ratio = 1.0f;
                  int speed = (int) (ratio * ${makeup_air_fan_max_speed});
                  if (speed < 1) speed = 1;
                  ESP_LOGD("muas", "exhaust=%.2fV -> makeup fan speed=%d%%",
                           id(exhaust_hood_voltage).state, speed);
                  return speed;
