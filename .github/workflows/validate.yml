name: Validate ESPHome configs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config: [muas, erv, sprinkler]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ESPHome
        run: pip install "esphome==2026.4.0"
      - name: Use the example secrets
        run: cp secrets.example.yaml secrets.yaml
      - name: Validate ${{ matrix.config }}
        run: esphome config ${{ matrix.config }}.yaml
      - name: Compile ${{ matrix.config }}
        run: esphome compile ${{ matrix.config }}.yaml
